name: Test PostgreSQL Versions

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      AUTOMATED_REPORTS: >-
        sql/0_node.sql
        sql/1_databases.sql
        sql/2_table_sizes.sql
        sql/3_table_stats.sql
        sql/a1_activity.sql
        sql/a2_queries_runing_n_seconds.sql
        sql/a3_connection_capacity.sql
        sql/a4_session_risks.sql
        sql/b1_table_estimation.sql
        sql/b2_btree_estimation.sql
        sql/b5_tables_no_stats.sql
        sql/e1_extensions.sql
        sql/i1_rare_indexes.sql
        sql/i2_redundant_indexes.sql
        sql/i3_duplicate_indexes.sql
        sql/i4_invalid_indexes.sql
        sql/i5_indexes_migration.sql
        sql/i6_non_indexed_fks.sql
        sql/i7_tables_without_primary_keys.sql
        sql/l1_lock_trees.sql
        sql/l2_lock_trees.sql
        sql/p1_index_create_progress.sql
        sql/r1_replication_status.sql
        sql/r2_replication_slots.sql
        sql/s1_pg_stat_statements_top_total.sql
        sql/s2_pg_stat_statements_report.sql
        sql/t1_parameters.sql
        sql/t2_storage_parameters.sql
        sql/v1_vacuum_activity.sql
        sql/v2_autovacuum_progress_and_queue.sql
        sql/v3_wraparound_risk.sql
        sql/x1_alignment_padding.sql
      EXCLUDED_REPORTS: >-
        sql/b3_table_pgstattuple.sql
        sql/b4_btree_pgstattuple.sql
        sql/k1_cancel_pid.sql
        sql/k2_terminate_pid.sql
        sql/u1_create_user_with_random_password.sql
        sql/u2_alter_user_with_random_password.sql

    strategy:
      matrix:
        postgres-version: ['14', '15', '16', '17', '18']
      fail-fast: false

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --auth-host=trust --auth-local=trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install PostgreSQL client
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y postgresql-client
        psql --version

    - name: Prepare test database
      run: |
        set -euo pipefail
        psql_args=(
          -h localhost
          -U postgres
          -d test
          --no-psqlrc
          -v ON_ERROR_STOP=1
        )

        until pg_isready -h localhost -p 5432 -U postgres; do
          echo "Waiting for postgres..."
          sleep 2
        done

        psql "${psql_args[@]}" -c 'SELECT version();'
        psql "${psql_args[@]}" -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements';"

        postgres_container="${{ job.services.postgres.id }}"
        if [[ -z "$postgres_container" ]]; then
          echo "PostgreSQL service container was not found"
          exit 1
        fi
        docker restart "$postgres_container"

        until pg_isready -h localhost -p 5432 -U postgres; do
          echo "Waiting for postgres after preload configuration..."
          sleep 2
        done

        preload_libraries=$(psql "${psql_args[@]}" -Atqc 'SHOW shared_preload_libraries;')
        [[ "$preload_libraries" == *"pg_stat_statements"* ]] || {
          echo "pg_stat_statements was not preloaded: $preload_libraries"
          exit 1
        }

        psql "${psql_args[@]}" -c 'CREATE EXTENSION pg_stat_statements;'
        psql "${psql_args[@]}" -c 'CREATE EXTENSION pgstattuple;'

        psql "${psql_args[@]}" -c 'CREATE USER dba_user;'
        psql "${psql_args[@]}" -c 'GRANT pg_monitor TO dba_user;'
        psql "${psql_args[@]}" -c 'GRANT CONNECT ON DATABASE test TO dba_user;'
        psql "${psql_args[@]}" -c 'GRANT USAGE ON SCHEMA public TO dba_user;'

        psql "${psql_args[@]}" -c "CREATE TABLE align1 AS SELECT 1::int4, 2::int8, 3::int4 AS more FROM generate_series(1, 100000) _(i);"
        psql "${psql_args[@]}" -c "CREATE TABLE align2 AS SELECT 1::int4, 3::int4 AS more, 2::int8 FROM generate_series(1, 100000) _(i);"
        psql "${psql_args[@]}" -c 'CREATE TABLE fk_parent (id int PRIMARY KEY, data text);'
        psql "${psql_args[@]}" -c 'CREATE TABLE fk_child (id int PRIMARY KEY, parent_id int, data text, CONSTRAINT fk_test FOREIGN KEY (parent_id) REFERENCES fk_parent(id));'
        psql "${psql_args[@]}" -c "INSERT INTO fk_parent SELECT i, 'data_' || i FROM generate_series(1, 100000) i;"
        psql "${psql_args[@]}" -c "INSERT INTO fk_child SELECT i, (i % 100000) + 1, 'data_' || i FROM generate_series(1, 200000) i;"
        psql "${psql_args[@]}" -c 'ANALYZE;'

        psql "${psql_args[@]}" -c 'GRANT SELECT ON ALL TABLES IN SCHEMA public TO dba_user;'
        psql "${psql_args[@]}" -c 'SELECT extname FROM pg_extension ORDER BY extname;'
        psql -h localhost -U dba_user -d test --no-psqlrc -v ON_ERROR_STOP=1 -c 'SELECT current_user, session_user;'

    - name: Validate report automation scope
      run: |
        set -euo pipefail

        declare -A declared_reports=()
        for report in $AUTOMATED_REPORTS $EXCLUDED_REPORTS; do
          if [[ ! -f "$report" ]]; then
            echo "Declared report does not exist: $report"
            exit 1
          fi
          declared_reports["$report"]=1
        done

        while IFS= read -r report; do
          if [[ -z "${declared_reports[$report]+declared}" ]]; then
            echo "Report is not classified for automation: $report"
            exit 1
          fi
        done < <(find sql -maxdepth 1 -type f -name '*.sql' -print | sort)

    - name: Verify SQL errors fail the executor
      run: |
        set -euo pipefail
        invalid_report="$RUNNER_TEMP/postgres_dba_invalid.sql"
        printf 'select 1;\nselect missing_column;\nselect 2;\n' > "$invalid_report"

        if psql -h localhost -U dba_user -d test --no-psqlrc \
          -v ON_ERROR_STOP=1 -f "$invalid_report" > /dev/null 2>&1; then
          echo "The executor accepted an intentionally invalid report"
          exit 1
        fi

        echo "The executor rejected the intentionally invalid report"

    - name: Test wide mode
      run: |
        set -euo pipefail
        actual_mode=$(PGOPTIONS="-c postgres_dba.wide=on" \
          psql -h localhost -U dba_user -d test --no-psqlrc \
            -v ON_ERROR_STOP=1 -Atqc "select current_setting('postgres_dba.wide');")
        if [[ "$actual_mode" != "on" ]]; then
          echo "Wide mode was not enabled: $actual_mode"
          exit 1
        fi

        for database_user in postgres dba_user; do
          echo "Testing safe reports in wide mode as $database_user..."
          for report in $AUTOMATED_REPORTS; do
            echo "  Testing $report..."
            if ! PGOPTIONS="-c postgres_dba.wide=on" PAGER=cat \
              psql -h localhost -U "$database_user" -d test --no-psqlrc \
                -v ON_ERROR_STOP=1 -v postgres_dba_interactive_mode=false \
                -f warmup.psql -f "$report" > /dev/null 2>&1; then
              echo "FAILED: $report in wide mode as $database_user"
              PGOPTIONS="-c postgres_dba.wide=on" PAGER=cat \
                psql -h localhost -U "$database_user" -d test --no-psqlrc \
                  -v ON_ERROR_STOP=1 -v postgres_dba_interactive_mode=false \
                  -f warmup.psql -f "$report"
              exit 1
            fi
          done
        done

    - name: Test normal mode
      run: |
        set -euo pipefail
        actual_mode=$(PGOPTIONS="-c postgres_dba.wide=off" \
          psql -h localhost -U dba_user -d test --no-psqlrc \
            -v ON_ERROR_STOP=1 -Atqc "select current_setting('postgres_dba.wide');")
        if [[ "$actual_mode" != "off" ]]; then
          echo "Normal mode was not enabled: $actual_mode"
          exit 1
        fi

        for database_user in postgres dba_user; do
          echo "Testing safe reports in normal mode as $database_user..."
          for report in $AUTOMATED_REPORTS; do
            echo "  Testing $report..."
            if ! PGOPTIONS="-c postgres_dba.wide=off" PAGER=cat \
              psql -h localhost -U "$database_user" -d test --no-psqlrc \
                -v ON_ERROR_STOP=1 -v postgres_dba_interactive_mode=false \
                -f warmup.psql -f "$report" > /dev/null 2>&1; then
              echo "FAILED: $report in normal mode as $database_user"
              PGOPTIONS="-c postgres_dba.wide=off" PAGER=cat \
                psql -h localhost -U "$database_user" -d test --no-psqlrc \
                  -v ON_ERROR_STOP=1 -v postgres_dba_interactive_mode=false \
                  -f warmup.psql -f "$report"
              exit 1
            fi
          done
        done

    - name: Test lock wait classification
      run: |
        set -euo pipefail
        psql_args=(
          -h localhost
          -U postgres
          -d test
          --no-psqlrc
          -v ON_ERROR_STOP=1
        )
        blocker_client_pid=""
        waiter_client_pid=""

        cleanup_lock_test() {
          set +e
          psql "${psql_args[@]}" -c "
            select pg_terminate_backend(pid)
            from pg_stat_activity
            where application_name in (
              'postgres_dba_lock_blocker',
              'postgres_dba_lock_waiter'
            );
          " > /dev/null 2>&1
          if [[ -n "$waiter_client_pid" ]]; then
            wait "$waiter_client_pid"
          fi
          if [[ -n "$blocker_client_pid" ]]; then
            wait "$blocker_client_pid"
          fi
          set -e
        }
        trap cleanup_lock_test EXIT

        PGAPPNAME=postgres_dba_lock_blocker \
          psql "${psql_args[@]}" -c "
            select pg_advisory_lock(987654321);
            select sum(sqrt(value))
            from generate_series(1, 1000000000) as cpu(value);
          " > "$RUNNER_TEMP/lock_blocker.log" 2>&1 &
        blocker_client_pid=$!

        blocker_ready=0
        for attempt in {1..40}; do
          blocker_ready=$(psql "${psql_args[@]}" -Atqc "
            select count(*)
            from pg_stat_activity
            where application_name = 'postgres_dba_lock_blocker'
              and state = 'active'
              and wait_event_type is null;
          ")
          if [[ "$blocker_ready" == "1" ]]; then
            break
          fi
          sleep 0.25
        done
        [[ "$blocker_ready" == "1" ]] || {
          echo "CPU blocker did not become active"
          sed -n '1,120p' "$RUNNER_TEMP/lock_blocker.log"
          exit 1
        }

        PGAPPNAME=postgres_dba_lock_waiter \
          psql "${psql_args[@]}" -c 'select pg_advisory_lock(987654321);' \
            > "$RUNNER_TEMP/lock_waiter.log" 2>&1 &
        waiter_client_pid=$!

        waiter_ready=0
        for attempt in {1..40}; do
          waiter_ready=$(psql "${psql_args[@]}" -Atqc "
            select count(*)
            from pg_stat_activity
            where application_name = 'postgres_dba_lock_waiter'
              and wait_event_type = 'Lock';
          ")
          if [[ "$waiter_ready" == "1" ]]; then
            break
          fi
          sleep 0.25
        done
        [[ "$waiter_ready" == "1" ]] || {
          echo "Lock waiter did not become blocked"
          sed -n '1,120p' "$RUNNER_TEMP/lock_waiter.log"
          exit 1
        }

        l1_output=$(PGOPTIONS="-c postgres_dba.wide=off" PAGER=cat \
          psql "${psql_args[@]}" -v postgres_dba_interactive_mode=false \
            -f warmup.psql -f sql/l1_lock_trees.sql)
        [[ "$l1_output" == *"waiting"* && "$l1_output" == *"active"* ]] || {
          echo "l1 lock/CPU classification regression failed"
          echo "$l1_output"
          exit 1
        }

        l2_output=$(PGOPTIONS="-c postgres_dba.wide=off" PAGER=cat \
          psql "${psql_args[@]}" -v postgres_dba_interactive_mode=false \
            -f warmup.psql -f sql/l2_lock_trees.sql)
        [[ "$l2_output" == *"waiting"* && "$l2_output" == *"CPU*"* ]] || {
          echo "l2 lock/CPU classification regression failed"
          echo "$l2_output"
          exit 1
        }

    - name: Run regression tests
      run: |
        set -euo pipefail
        psql_args=(
          -h localhost
          -d test
          --no-psqlrc
          -v ON_ERROR_STOP=1
          -v postgres_dba_interactive_mode=false
        )

        run_report() {
          local database_user="$1"
          local report="$2"
          PGOPTIONS="-c postgres_dba.wide=off" PAGER=cat \
            psql "${psql_args[@]}" -U "$database_user" \
              -f warmup.psql -f "$report"
        }

        output=$(run_report dba_user sql/0_node.sql)
        [[ "$output" == *"Primary"* \
          && "$output" == *"WAL Position"* \
          && "$output" == *"Replication Slots"* ]] || {
          echo "Node role regression failed"
          echo "$output"
          exit 1
        }

        output=$(run_report dba_user sql/x1_alignment_padding.sql)
        [[ "$output" == *"align1"* && "$output" == *"align2"* && "$output" == *"int4, more, int8"* ]] || {
          echo "Alignment padding regression failed"
          echo "$output"
          exit 1
        }

        output=$(run_report dba_user sql/a1_activity.sql)
        [[ "$output" == *"User"* ]] || {
          echo "Activity regression failed"
          echo "$output"
          exit 1
        }

        output=$(run_report dba_user sql/t1_parameters.sql)
        [[ "$output" == *"autovacuum_naptime"* \
          && "$output" == *"60 s"* ]] || {
          echo "Parameter unit regression failed"
          echo "$output"
          exit 1
        }

        output=$(run_report dba_user sql/i6_non_indexed_fks.sql)
        [[ "$output" == *"fk_child"* && "$output" == *"fk_test"* ]] || {
          echo "Foreign key regression failed without intarray"
          echo "$output"
          exit 1
        }

        psql "${psql_args[@]}" -U postgres -c 'DROP EXTENSION pg_stat_statements;'
        output=$(run_report dba_user sql/s1_pg_stat_statements_top_total.sql)
        [[ "$output" == *"pg_stat_statements is not available"* ]] || {
          echo "pg_stat_statements absence regression failed for s1"
          echo "$output"
          exit 1
        }
        output=$(run_report dba_user sql/s2_pg_stat_statements_report.sql)
        [[ "$output" == *"pg_stat_statements is not available"* ]] || {
          echo "pg_stat_statements absence regression failed for s2"
          echo "$output"
          exit 1
        }

        psql "${psql_args[@]}" -U postgres -c 'CREATE EXTENSION pg_stat_statements;'
        psql "${psql_args[@]}" -U postgres -c 'SELECT 1;'
        output=$(run_report dba_user sql/s1_pg_stat_statements_top_total.sql)
        [[ "$output" != *"pg_stat_statements is not available"* ]] || {
          echo "pg_stat_statements loaded regression failed for s1"
          echo "$output"
          exit 1
        }
        output=$(run_report dba_user sql/s2_pg_stat_statements_report.sql)
        [[ "$output" != *"pg_stat_statements is not available"* ]] || {
          echo "pg_stat_statements loaded regression failed for s2"
          echo "$output"
          exit 1
        }

        psql "${psql_args[@]}" -U postgres -c 'CREATE EXTENSION intarray;'
        output=$(run_report dba_user sql/i6_non_indexed_fks.sql)
        [[ "$output" == *"fk_child"* && "$output" == *"fk_test"* ]] || {
          echo "Foreign key regression failed with intarray"
          echo "$output"
          exit 1
        }

        echo "All regression tests passed"
