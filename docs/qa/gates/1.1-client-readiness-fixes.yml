resolved_issues:
  - id: 'REL-001'
    severity: high
    finding: 'Explicit NOSUPERUSER made u2 fail for non-superuser CREATEROLE operators (must be superuser to change superuser attribute).'
    resolution: 'NOSUPERUSER emitted only for roles that are currently superusers; tested as a CREATEROLE operator.'
  - id: 'SEC-001'
    severity: high
    finding: 'A failed CREATE/ALTER ROLE showed the statement, including the password, as error CONTEXT on the client and in the server log.'
    resolution: 'EXECUTE wrapped in a handler that re-raises SQLSTATE and message only; tested for u1 and u2.'
residual_risks:
  - 'The executed CREATE/ALTER ROLE contains the password, so pg_stat_statements.track = all or auto_explain with nested statements can capture it (documented in README).'
